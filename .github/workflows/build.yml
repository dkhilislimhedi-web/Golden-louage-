name: Build Golden Louage APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.goldenlouage --project-name golden_louage /tmp/golden_scaffold
          mkdir -p android
          cp -R /tmp/golden_scaffold/android/. android/

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: golden-louage-apk
          path: build/app/outputs/flutter-apk/app-release.apk
