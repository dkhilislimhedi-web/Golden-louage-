
name: Build Golden Louage APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project structure
        run: |
          flutter create --project-name golden_louage --org com.goldenlouage .

      - name: Configure Firebase Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()
          plugin = 'id("com.google.gms.google-services") version "4.4.4" apply false'

          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  "plugins {",
                  "plugins {\n    " + plugin,
                  1
              )
          settings.write_text(text)

          app_gradle = Path("android/app/build.gradle.kts")
          text = app_gradle.read_text()
          app_plugin = 'id("com.google.gms.google-services")'

          if app_plugin not in text:
              text = text.replace(
                  "plugins {",
                  "plugins {\n    " + app_plugin,
                  1
              )
          app_gradle.write_text(text)
          PY

      - name: Add Firebase dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path("pubspec.yaml")
          text = pubspec.read_text()

          if "firebase_core:" not in text:
              text = text.replace(
                  "dependencies:",
                  "dependencies:\n  firebase_core: ^4.2.1\n  firebase_auth: ^6.1.1\n  cloud_firestore: ^6.1.0",
                  1
              )

          pubspec.write_text(text)
          PY

      - name: Generate SHA-1 report
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: golden-louage-apk
          path: build/app/outputs/flutter-apk/app-release.apk
